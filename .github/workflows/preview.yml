# Branch preview sets: this repo's Vercel preview of a pull request's branch is served on
# pr-<branch>-payment-request.dailyminty.com, beside the other apps of the same set. The workflow body is
# shared: minty-oliveandvine/.github -> .github/workflows/vercel-preview-set.yml. Its own file,
# never ci.yml: a second job there would add a second "check / check" run, the name Vercel's
# production check is bound to. pull_request_target runs the BASE branch's copy of this file, so
# a pull request cannot change what runs with VERCEL_TOKEN. The variables and the secret are
# written by minty-infra (github.tf).
name: preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    uses: minty-oliveandvine/.github/.github/workflows/vercel-preview-set.yml@v1
    with:
      app: payment-request
      apps: ${{ vars.PREVIEW_APPS }}
      vercel-team-id: ${{ vars.VERCEL_TEAM_ID }}
      backend-label: ${{ vars.PREVIEW_BACKEND_LABEL }}
    secrets:
      vercel-token: ${{ secrets.VERCEL_TOKEN }}
